; ─────────────────────────────────────────────────────────────────────────────
; Supervisor configuration for EMC Backend queue workers
;
; Copy to: /etc/supervisor/conf.d/emc.conf
; Then:    sudo supervisorctl reread && sudo supervisorctl update
;          sudo supervisorctl start emc-worker:*
; ─────────────────────────────────────────────────────────────────────────────

; ── Default queue worker (handles all standard jobs) ─────────────────────────
[program:emc-worker]
process_name    = %(program_name)s_%(process_num)02d
command         = php /var/www/emc-backend/artisan queue:work database \
                      --queue=default \
                      --sleep=3 \
                      --tries=3 \
                      --timeout=90 \
                      --max-time=3600 \
                      --memory=256
autostart       = true
autorestart     = true
stopasgroup     = true
killasgroup     = true
user            = www-data
numprocs        = 2
startsecs       = 5
stopwaitsecs    = 3600
redirect_stderr = true
stdout_logfile  = /var/log/supervisor/emc-worker.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 5

; ── Webhook job worker (isolated, single process, high priority) ───────────────
[program:emc-webhook-worker]
process_name    = %(program_name)s
command         = php /var/www/emc-backend/artisan queue:work database \
                      --queue=webhooks,default \
                      --sleep=1 \
                      --tries=5 \
                      --timeout=60 \
                      --max-time=3600
autostart       = true
autorestart     = true
stopasgroup     = true
killasgroup     = true
user            = www-data
numprocs        = 1
startsecs       = 5
stopwaitsecs    = 3600
redirect_stderr = true
stdout_logfile  = /var/log/supervisor/emc-webhook-worker.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3

; ── Scheduler runner (replaces cron — optional Supervisor approach) ────────────
; Alternatively, add this to crontab: * * * * * www-data php /var/www/emc-backend/artisan schedule:run >> /dev/null 2>&1
[program:emc-scheduler]
process_name    = %(program_name)s
command         = php /var/www/emc-backend/artisan schedule:work
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
startsecs       = 5
redirect_stderr = true
stdout_logfile  = /var/log/supervisor/emc-scheduler.log
stdout_logfile_maxbytes = 5MB
stdout_logfile_backups  = 2

; ─────────────────────────────────────────────────────────────────────────────
; Group — restart all EMC processes at once: sudo supervisorctl restart emc:*
; ─────────────────────────────────────────────────────────────────────────────
[group:emc]
programs = emc-worker,emc-webhook-worker,emc-scheduler
